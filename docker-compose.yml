# One service: the analyst review dashboard (see Dockerfile for why the Scala/Spark compiler
# side isn't containerised alongside it). Run: docker compose up --build, then open
# http://localhost:8000.
services:
  dashboard:
    build: .
    ports:
      - "8000:8000"
    environment:
      # Reads from a local .env file if present (see .env.example); GROQ_API_KEY is only needed
      # for the live prompted-extraction panel — classical extraction and Stage 3 validation work
      # without it.
      - GROQ_API_KEY=${GROQ_API_KEY:-}
    volumes:
      # Read-only: lets the container pick up new sample reports/results without a rebuild.
      - ./data/samples:/app/data/samples:ro
      - ./experiments/results:/app/experiments/results:ro
    # Not persisted: main.py's audit log (dashboard/backend/audit_log.json) resets on container
    # restart. It's already .gitignore'd as "generated by using the app, not source" — the same
    # reasoning applies here; mounting a volume over the directory that also holds main.py would
    # risk masking the application code, so this stays simple rather than clever.
