# docker compose up --build          -> http://localhost:8000
#
# The service is TOKEN-protected because a container is not a loopback peer. Either export your own tokens
#   SF_API_TOKENS="ana:choose-a-long-random-string:analyst,vic:another-one:viewer" docker compose up --build
# or leave it unset: a random admin token is generated and printed ONCE in the log (docker compose logs forge).
#
# TARGET=full builds the JDK + Spark image (real Spark batch/streaming runs); the default slim image uses the
# Python reference engine and labels every run with it.
services:
  forge:
    build:
      context: .
      target: ${TARGET:-slim}
    ports:
      - "127.0.0.1:8000:8000"        # bound to loopback on the host; put a reverse proxy with TLS in front to expose it
    environment:
      - SF_API_TOKENS=${SF_API_TOKENS:-}
      - GROQ_API_KEY=${GROQ_API_KEY:-}     # optional: only the prompted-LLM extractor uses it
    volumes:
      - forge-data:/data                  # SQLite db, run directories, dataset versions
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
volumes:
  forge-data:
